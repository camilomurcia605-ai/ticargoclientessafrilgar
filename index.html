<script type="text/babel" data-presets="react">
/* ============================================================
   2. UTILIDADES: rutas anidadas, moneda, fechas, localStorage
   ============================================================ */
function getPath(obj, path) {
  return path.split('.').reduce((acc, key) => (acc === null || acc === undefined ? acc : acc[key]), obj);
}
function setPath(obj, path, value) {
  const keys = path.split('.');
  const raiz = Array.isArray(obj) ? [...obj] : { ...(obj || {}) };
  let cursor = raiz;
  for (let i = 0; i < keys.length - 1; i++) {
    const k = keys[i];
    const nextIsIndex = /^\d+$/.test(keys[i + 1]);
    const existente = cursor[k];
    cursor[k] = existente ? (Array.isArray(existente) ? [...existente] : { ...existente }) : (nextIsIndex ? [] : {});
    cursor = cursor[k];
  }
  cursor[keys[keys.length - 1]] = value;
  return raiz;
}

function formatCOP(value) {
  if (value === undefined || value === null || value === '') return '';
  const n = typeof value === 'string' ? Number(value.replace(/[^\d.-]/g, '')) : value;
  if (Number.isNaN(n)) return '';
  return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', minimumFractionDigits: 0, maximumFractionDigits: 0 }).format(n);
}
function parseCOP(value) {
  const digits = value.replace(/[^\d]/g, '');
  return digits ? Number(digits) : 0;
}
function formatFechaCorta(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso;
  return d.toLocaleDateString('es-CO');
}
function hoyISO() { return new Date().toISOString().slice(0, 10); }

function draftKey(codigo) { return `ticargo_form_${codigo}`; }
function guardarBorrador(codigo, data) {
  try { localStorage.setItem(draftKey(codigo), JSON.stringify({ data, savedAt: new Date().toISOString() })); return true; }
  catch (e) { console.error(e); return false; }
}
function leerBorrador(codigo) {
  try { const raw = localStorage.getItem(draftKey(codigo)); return raw ? JSON.parse(raw) : null; } catch { return null; }
}
function marcarCompletado(codigo) {
  try { localStorage.setItem(`${draftKey(codigo)}_completado`, 'true'); } catch {}
}
function estadoFormulario(codigo) {
  const borrador = leerBorrador(codigo);
  if (!borrador) return 'nuevo';
  try { if (localStorage.getItem(`${draftKey(codigo)}_completado`) === 'true') return 'completado'; } catch {}
  return 'en-progreso';
}
</script>

<script type="text/babel" data-presets="react">
/* ============================================================
   4. MOTOR DE CAMPOS (config-driven, como el proyecto Next.js)
   ============================================================ */
function Campo({ field, datos, set }) {
  if (field.showIf && !field.showIf(datos)) return null;
  const valor = getPath(datos, field.name);
  const colSpanClass = field.colSpan === 2 ? 'sm:col-span-2' : '';

  if (field.type === 'staticText') {
    return (
      <div className={colSpanClass}>
        {field.label && <p className="mb-1.5 text-sm font-semibold text-ticargo-black">{field.label}</p>}
        <div className="whitespace-pre-line rounded-lg border border-ticargo-border bg-ticargo-gray/60 p-4 text-xs leading-relaxed text-ticargo-black/75">{field.content}</div>
      </div>
    );
  }

  if (field.type === 'signature') {
    return (
      <div className={`rounded-lg border border-ticargo-border bg-ticargo-gray/50 p-4 sm:col-span-2`}>
        <p className="mb-3 text-sm font-semibold text-ticargo-black">{field.label || 'Firma'}</p>
        <div className="grid grid-cols-1 gap-4 sm:grid-cols-2">
          <TextInput label="Nombre completo del firmante" value={getPath(datos, field.name + '.nombre')} onChange={(v) => set(field.name + '.nombre', v)} required />
          <TextInput label="Número de documento" value={getPath(datos, field.name + '.documento')} onChange={(v) => set(field.name + '.documento', v)} required />
          <TextInput type="date" label="Fecha de firma" value={getPath(datos, field.name + '.fecha')} onChange={(v) => set(field.name + '.fecha', v)} required />
          <TextInput label="Ciudad de firma" value={getPath(datos, field.name + '.ciudad')} onChange={(v) => set(field.name + '.ciudad', v)} required />
        </div>
      </div>
    );
  }

  if (field.type === 'dynamicList') {
    const items = valor || [];
    const max = field.maxItems || 10;
    const plantilla = Object.fromEntries(field.itemFields.map((f) => [f.name, '']));
    return (
      <div className="sm:col-span-2">
        <div className="mb-2 flex items-center justify-between">
          <p className="text-sm font-semibold text-ticargo-black">{field.label}</p>
          <button type="button" disabled={items.length >= max} onClick={() => set(field.name, [...items, plantilla])}
            className="flex items-center gap-1 rounded-md border border-ticargo-red px-2.5 py-1 text-xs font-medium text-ticargo-red hover:bg-ticargo-red/5 disabled:cursor-not-allowed disabled:opacity-40">
            <IconPlus size={14} /> Agregar ({items.length}/{max})
          </button>
        </div>
        <div className="space-y-3">
          {items.length === 0 && <p className="text-xs text-ticargo-black/40">No se han agregado registros.</p>}
          {items.map((item, idx) => (
            <div key={idx} className="relative rounded-lg border border-ticargo-border bg-white p-4">
              <button type="button" onClick={() => set(field.name, items.filter((_, i) => i !== idx))} className="absolute right-3 top-3 text-ticargo-black/30 hover:text-ticargo-red">
                <IconTrash size={15} />
              </button>
              <div className="grid grid-cols-1 gap-3 pr-6 sm:grid-cols-2">
                {field.itemFields.map((sub) => (
                  <Campo key={sub.name} field={{ ...sub, name: `${field.name}.${idx}.${sub.name}` }} datos={datos} set={set} />
                ))}
              </div>
            </div>
          ))}
        </div>
      </div>
    );
  }

  if (field.type === 'matrix') {
    const preguntas = field.preguntas;
    return (
      <div className="sm:col-span-2 overflow-x-auto rounded-lg border border-ticargo-border">
        <table className="w-full text-sm">
          <thead className="bg-ticargo-gray">
            <tr>
              <th className="w-8 px-3 py-2 text-left font-semibold text-ticargo-black">#</th>
              <th className="px-3 py-2 text-left font-semibold text-ticargo-black">Pregunta</th>
              <th className="px-3 py-2 text-left font-semibold text-ticargo-black">Respuesta</th>
              <th className="px-3 py-2 text-left font-semibold text-ticargo-black">Observación</th>
            </tr>
          </thead>
          <tbody className="divide-y divide-ticargo-border">
            {preguntas.map((pregunta, idx) => {
              const base = `${field.name}.${idx}`;
              const respuesta = getPath(datos, `${base}.respuesta`);
              return (
                <tr key={idx} className={idx % 2 === 0 ? 'bg-white' : 'bg-ticargo-gray/40'}>
                  <td className="px-3 py-2 align-top text-ticargo-black/50">{idx + 1}</td>
                  <td className="px-3 py-2 align-top text-ticargo-black/85">{pregunta}</td>
                  <td className="px-3 py-2 align-top">
                    <div className="flex gap-3">
                      {[['si','Sí'],['no','No'],['na','N.A.']].map(([v,l]) => (
                        <label key={v} className="flex items-center gap-1 text-xs text-ticargo-black/70">
                          <input type="radio" checked={respuesta === v} onChange={() => set(`${base}.respuesta`, v)} className="h-3.5 w-3.5 accent-ticargo-red" /> {l}
                        </label>
                      ))}
                    </div>
                  </td>
                  <td className="px-3 py-2 align-top">
                    <input type="text" value={getPath(datos, `${base}.observacion`) || ''} onChange={(e) => set(`${base}.observacion`, e.target.value)}
                      className="w-full rounded border border-ticargo-border px-2 py-1 text-xs focus:border-ticargo-red focus:outline-none" />
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    );
  }

  if (field.type === 'currency') {
    return (
      <div className={colSpanClass}>
        <label className="label-field">{field.label} {field.required && <span className="text-ticargo-red">*</span>}</label>
        <input type="text" inputMode="numeric" className="input-field" placeholder="$ 0" value={valor ? formatCOP(valor) : ''} onChange={(e) => set(field.name, parseCOP(e.target.value))} />
      </div>
    );
  }

  if (field.type === 'select') {
    return (
      <div className={colSpanClass}>
        <label className="label-field">{field.label} {field.required && <span className="text-ticargo-red">*</span>}</label>
        <select className="input-field" value={valor || ''} onChange={(e) => set(field.name, e.target.value)}>
          <option value="">Seleccione...</option>
          {field.options.map((o) => <option key={o.value} value={o.value}>{o.label}</option>)}
        </select>
      </div>
    );
  }

  if (field.type === 'radio') {
    return (
      <div className={colSpanClass}>
        <p className="mb-1.5 text-sm font-medium text-ticargo-black">{field.label} {field.required && <span className="text-ticargo-red">*</span>}</p>
        <div className="flex flex-wrap gap-x-5 gap-y-2">
          {field.options.map((o) => (
            <label key={o.value} className="flex items-center gap-1.5 text-sm text-ticargo-black/80">
              <input type="radio" checked={valor === o.value} onChange={() => set(field.name, o.value)} className="h-4 w-4 accent-ticargo-red" /> {o.label}
            </label>
          ))}
        </div>
      </div>
    );
  }

  if (field.type === 'checkboxGroup') {
    const arr = valor || [];
    return (
      <div className={colSpanClass}>
        <p className="mb-1.5 text-sm font-medium text-ticargo-black">{field.label} {field.required && <span className="text-ticargo-red">*</span>}</p>
        <div className="flex flex-wrap gap-x-5 gap-y-2">
          {field.options.map((o) => (
            <label key={o.value} className="flex items-center gap-1.5 text-sm text-ticargo-black/80">
              <input type="checkbox" checked={arr.includes(o.value)} onChange={() => set(field.name, arr.includes(o.value) ? arr.filter((v) => v !== o.value) : [...arr, o.value])} className="h-4 w-4 rounded accent-ticargo-red" /> {o.label}
            </label>
          ))}
        </div>
      </div>
    );
  }

  if (field.type === 'checkbox') {
    return (
      <label className={`flex items-start gap-2 text-sm text-ticargo-black/85 ${colSpanClass}`}>
        <input type="checkbox" checked={!!valor} onChange={(e) => set(field.name, e.target.checked)} className="mt-0.5 h-4 w-4 rounded accent-ticargo-red" />
        <span>{field.label} {field.required && <span className="text-ticargo-red">*</span>}</span>
      </label>
    );
  }

  // text, email, url, number, date, textarea
  return (
    <div className={colSpanClass}>
      <TextInput label={field.label} type={field.type} value={valor} onChange={(v) => set(field.name, v)} required={field.required} placeholder={field.placeholder} />
    </div>
  );
}

function TextInput({ label, type = 'text', value, onChange, required, placeholder }) {
  return (
    <div>
      <label className="label-field">{label} {required && <span className="text-ticargo-red">*</span>}</label>
      {type === 'textarea' ? (
        <textarea rows={3} className="input-field" placeholder={placeholder} value={value || ''} onChange={(e) => onChange(e.target.value)} />
      ) : (
        <input type={type} className="input-field" placeholder={placeholder} value={value || ''} onChange={(e) => onChange(e.target.value)} />
      )}
    </div>
  );
}
</script>

      { titulo:'1. INFORMACIÓN GENERAL', columns:2, rows:[
        { label:'Tipo de vinculación', value: d.general.tipoVinculacion==='nueva'?'Vinculación nueva':'Actualización anual' },
        { label:'Tipo de contraparte', value: d.general.tipoContraparte },
        { label:'Fecha de diligenciamiento', value: formatFechaCorta(d.general.fechaDiligenciamiento) },
      ]},
      { titulo:'2. DATOS PERSONALES', columns:2, rows:[
        { label:'Primer apellido', value:d.personales.primerApellido }, { label:'Segundo apellido', value:d.personales.segundoApellido },
        { label:'Nombres', value:d.personales.nombres }, { label:'Tipo / N° documento', value:`${d.personales.tipoDocumento} ${d.personales.numeroDocumento}` },
        { label:'Fecha / lugar expedición', value:`${formatFechaCorta(d.personales.fechaExpedicion)} — ${d.personales.lugarExpedicion}` },
        { label:'Fecha / lugar nacimiento', value:`${formatFechaCorta(d.personales.fechaNacimiento)} — ${d.personales.lugarNacimiento}` },
        { label:'Nacionalidad', value:d.personales.nacionalidad }, { label:'Género', value:d.personales.genero }, { label:'Estado civil', value:d.personales.estadoCivil },
      ]},
      { titulo:'3. INFORMACIÓN DE CONTACTO', columns:2, rows:[
        { label:'Dirección residencia', value:d.contacto.direccionResidencia }, { label:'Ciudad / Departamento', value:`${d.contacto.ciudad} / ${d.contacto.departamento}` },
        { label:'País', value:d.contacto.pais }, { label:'Teléfono fijo', value:d.contacto.telefonoFijo }, { label:'Celular', value:d.contacto.celular },
        { label:'Correo electrónico', value:d.contacto.email }, { label:'Dirección correspondencia', value:d.contacto.direccionCorrespondencia },

      { titulo:'4. INFORMACIÓN LABORAL / ACTIVIDAD ECONÓMICA', columns:2, rows:[
        { label:'Actividad económica', value:d.laboral.actividadEconomica }, { label:'Profesión / Ocupación', value:d.laboral.profesion },

      ]},
      { titulo:'5. INFORMACIÓN FINANCIERA (COP)', columns:2, rows:[
        { label:'Ingresos mensuales', value:formatCOP(d.financiera.ingresosMensuales) }, { label:'Egresos mensuales', value:formatCOP(d.financiera.egresosMensuales) },
        { label:'Otros ingresos', value:formatCOP(d.financiera.otrosIngresos) }, { label:'Detalle otros ingresos', value:d.financiera.detalleOtrosIngresos },
        { label:'Total activos', value:formatCOP(d.financiera.totalActivos) }, { label:'Total pasivos', value:formatCOP(d.financiera.totalPasivos) },
        { label:'Total patrimonio', value:formatCOP(patrimonio) },
      ]},
      { titulo:'6. OPERACIONES INTERNACIONALES', columns:2, rows:[
        { label:'¿Opera en moneda extranjera?', value:SI(d.internacional.operaMonedaExtranjera) }, { label:'Tipo de operación', value:(d.internacional.tipoOperacion||[]).join(', ') },
        { label:'¿Productos en el exterior?', value:SI(d.internacional.poseeProductosExterior) }, { label:'Producto / Entidad', value:`${d.internacional.tipoProducto||''} ${d.internacional.entidad||''}`.trim() },
        { label:'País / Ciudad', value:`${d.internacional.paisProducto||''} ${d.internacional.ciudadProducto||''}`.trim() }, { label:'Monto', value:formatCOP(d.internacional.montoProducto) },
      ]},
      { titulo:'7. PERSONAS EXPUESTAS POLÍTICAMENTE (PEP)', columns:2, rows:[
        { label:'¿Es PEP?', value:SI(d.pep.esPep) }, { label:'Cargo PEP', value:d.pep.cargoPep },
        { label:'Vinculación / Desvinculación', value:`${formatFechaCorta(d.pep.fechaVinculacionPep)} — ${formatFechaCorta(d.pep.fechaDesvinculacionPep)}` },

      ]},
      { titulo:'8. DECLARACIONES Y AUTORIZACIONES', paragraphs:[
        `Declaración juramentada: ${d.declaraciones.declaracionJuramentada?'ACEPTADA':'NO ACEPTADA'}`,
        `Autorización de consulta y reporte: ${d.declaraciones.autorizacionConsulta?'ACEPTADA':'NO ACEPTADA'}`,
        `Autorización tratamiento de datos personales: ${d.declaraciones.autorizacionDatos?'ACEPTADA':'NO ACEPTADA'}`,
      ]},
      { titulo:'FIRMA', columns:2, rows:[
        { label:'Nombre del firmante', value:d.firma.nombre }, { label:'Documento', value:d.firma.documento },

    ];

    const patrimonio = (d.financiera.totalActivos||0) - (d.financiera.totalPasivos||0);

      { titulo:'1. INFORMACIÓN GENERAL', columns:2, rows:[
        { label:'Tipo de vinculación', value: d.general.tipoVinculacion==='nueva'?'Vinculación nueva':'Actualización anual' },

        { label:'País', value:d.contacto.pais }, { label:'Teléfono', value:d.contacto.telefono }, { label:'Sitio web', value:d.contacto.sitioWeb }, { label:'Correo corporativo', value:d.contacto.email },

      { label:'Nombres', value:r.nombres }, { label:'Tipo / N° documento', value:`${r.tipoDocumento||''} ${r.numeroDocumento||''}`.trim() },

    secciones.push({ titulo:'9. INFORMACIÓN TRIBUTARIA', columns:2, rows:[

      { label:'Autorretenedor', value:SI(d.tributaria.autorretenedor) }, { label:'Agente de retención', value:SI(d.tributaria.agenteRetencion) },
    ]});
    if ((d.referencias||[]).length) secciones.push({ titulo:'10. REFERENCIAS', rows:(d.referencias||[]).map((r,i)=>({ label:`Referencia ${i+1} (${r.tipo||''})`, value:`${r.nombreEntidad||''} — ${r.contacto||''} — ${r.telefono||''} — ${r.ciudad||''}` })) });
    secciones.push({ titulo:'11. DECLARACIONES Y AUTORIZACIONES', paragraphs:[
      `Declaración juramentada: ${d.declaraciones.declaracionJuramentada?'ACEPTADA':'NO ACEPTADA'}`, `Autorización de consulta y reporte: ${d.declaraciones.autorizacionConsulta?'ACEPTADA':'NO ACEPTADA'}`, `Autorización tratamiento de datos personales: ${d.declaraciones.autorizacionDatos?'ACEPTADA':'NO ACEPTADA'}`,
    ]});
    secciones.push({ titulo:'FIRMA DEL REPRESENTANTE LEGAL', columns:2, rows:[
      { label:'Nombre', value:d.firma.nombre }, { label:'Documento', value:d.firma.documento }, { label:'Fecha de firma', value:formatFechaCorta(d.firma.fecha) }, { label:'Ciudad de firma', value:d.firma.ciudad },
    ]});
    return secciones;
  }

  if (slug === 'origen-fondos') {
    const secciones = [
      { titulo:'1. DATOS DEL DECLARANTE', columns:2, rows:[
        { label:'Nombre / Razón Social', value:d.declarante.nombreRazonSocial }, { label:'Tipo documento / NIT', value:d.declarante.tipoDocumentoNit },
        { label:'Número de documento', value:d.declarante.numeroDocumento }, { label:'Representante Legal', value:d.declarante.representanteLegal },
      ]},
      { titulo:'2. ORIGEN DE LOS FONDOS', paragraphs:[d.origenFondos.descripcion], rows:[
        { label:'Fuente principal de ingresos', value:(d.origenFondos.fuentePrincipal||[]).join(', ') + (d.origenFondos.fuenteOtro?` (${d.origenFondos.fuenteOtro})`:'') },
      ]},
    ];
    if (d.bienes.poseeInmuebles==='si' && (d.bienes.inmuebles||[]).length) secciones.push({ titulo:'3. BIENES INMUEBLES', rows:(d.bienes.inmuebles||[]).map((i,idx)=>({ label:`Inmueble ${idx+1}`, value:`${i.descripcion||''} — ${i.ubicacion||''} — ${formatCOP(Number(i.valorComercial)||0)}` })) });
    if (d.bienes.poseeVehiculos==='si' && (d.bienes.vehiculos||[]).length) secciones.push({ titulo:'4. VEHÍCULOS', rows:(d.bienes.vehiculos||[]).map((v,idx)=>({ label:`Vehículo ${idx+1}`, value:`${v.tipo||''} ${v.marca||''} ${v.modelo||''} — Placa ${v.placa||''} — ${formatCOP(Number(v.valorComercial)||0)}` })) });
    secciones.push({ titulo:'DECLARACIÓN JURAMENTADA', paragraphs:[`Estado de la declaración: ${d.declaracion.aceptaDeclaracion?'ACEPTADA':'NO ACEPTADA'}`] });
    secciones.push({ titulo:'FIRMA', columns:2, rows:[{ label:'Nombre', value:d.firma.nombre }, { label:'Documento', value:d.firma.documento }, { label:'Fecha', value:formatFechaCorta(d.firma.fecha) }, { label:'Ciudad', value:d.firma.ciudad }] });
    return secciones;
  }

  if (slug === 'habeas-data') {
    return [
      { titulo:'1. DATOS DEL TITULAR', columns:2, rows:[
        { label:'Nombre / Razón Social', value:d.titular.nombreRazonSocial }, { label:'Tipo y número de documento', value:d.titular.tipoNumeroDocumento },
        { label:'Correo electrónico', value:d.titular.email }, { label:'Teléfono', value:d.titular.telefono },
      ]},
      { titulo:'2. TEXTO DE AUTORIZACIÓN', paragraphs: TEXTO_HABEAS_DATA.split('\n\n') },
      { titulo:'3. AUTORIZACIÓN', paragraphs:[
        `Autorización de tratamiento de datos: ${d.autorizacion.autorizaTratamiento?'ACEPTADA':'NO ACEPTADA'}`, `Conocimiento de derechos (Art. 8, Ley 1581/2012): ${d.autorizacion.conoceDerechos?'DECLARADO':'NO DECLARADO'}`,
      ]},
      { titulo:'FIRMA', columns:2, rows:[{ label:'Nombre', value:d.firma.nombre }, { label:'Documento', value:d.firma.documento }, { label:'Fecha', value:formatFechaCorta(d.firma.fecha) }, { label:'Ciudad', value:d.firma.ciudad }] },
    ];
  }

  if (slug === 'acuerdo-seguridad') {
    return [
      { titulo:'1. DATOS DE LA CONTRAPARTE', columns:2, rows:[
        { label:'Nombre / Razón Social', value:d.contraparte.nombreRazonSocial }, { label:'NIT / CC', value:d.contraparte.nitCc }, { label:'Representante Legal', value:d.contraparte.representanteLegal },
        { label:'Dirección', value:d.contraparte.direccion }, { label:'Ciudad', value:d.contraparte.ciudad }, { label:'Teléfono', value:d.contraparte.telefono },
        { label:'Correo electrónico', value:d.contraparte.email }, { label:'Actividad económica', value:d.contraparte.actividadEconomica }, { label:'Productos/servicios', value:d.contraparte.productosServicios },
      ]},
      { titulo:'2. COMPROMISOS DE SEGURIDAD', rows: COMPROMISOS_SEGURIDAD_BASC.map((texto,i)=>({ label:`${i+1}.`, value: (d.compromisos[`c${i}`]?'ACEPTADO — ':'NO ACEPTADO — ') + texto })) },
      { titulo:'3. FIRMA', columns:2, rows:[
        { label:'Declaración de aceptación', value:d.declaracion.aceptaCondiciones?'ACEPTADA':'NO ACEPTADA' }, { label:'Nombre completo', value:d.firma.nombre }, { label:'Documento', value:d.firma.documento },
        { label:'Cargo', value:d.firma.cargo }, { label:'Fecha', value:formatFechaCorta(d.firma.fecha) }, { label:'Ciudad', value:d.firma.ciudad },
      ]},

  }

  if (slug === 'visita-seguridad') {
    const RESP = { si:'Sí', no:'No', na:'N.A.' };
    return [
      { titulo:'1. DATOS DE LA EMPRESA VISITADA', columns:2, rows:[
        { label:'Razón Social', value:d.empresa.razonSocial }, { label:'NIT', value:d.empresa.nit }, { label:'Dirección', value:d.empresa.direccion },
        { label:'Ciudad', value:d.empresa.ciudad }, { label:'Persona que atiende', value:d.empresa.personaAtiende }, { label:'Cargo', value:d.empresa.cargo }, { label:'Fecha de la visita', value:formatFechaCorta(d.empresa.fechaVisita) },
      ]},
      { titulo:'2. CUESTIONARIO DE SEGURIDAD', rows:d.cuestionario.map((p,i)=>({ label:`${i+1}. ${p.pregunta}`, value:`${RESP[p.respuesta]||'Sin responder'}${p.observacion?' — '+p.observacion:''}` })) },
      { titulo:'3. OBSERVACIONES GENERALES', paragraphs:[ d.observaciones.observacionesGenerales || 'Sin observaciones adicionales.', `Concepto de la visita: ${d.observaciones.concepto}`, d.observaciones.recomendaciones?`Recomendaciones: ${d.observaciones.recomendaciones}`:'' ].filter(Boolean) },
      { titulo:'4. FIRMAS', columns:2, rows:[
        { label:'Visitador — Nombre', value:d.firmaVisitador.nombre }, { label:'Visitador — Cargo/Doc.', value:`${d.firmaVisitador.cargo||''} / ${d.firmaVisitador.documento}` }, { label:'Visitador — Fecha', value:formatFechaCorta(d.firmaVisitador.fecha) },
        { label:'Atiende — Nombre', value:d.firmaAtiende.nombre }, { label:'Atiende — Cargo/Doc.', value:`${d.firmaAtiende.cargo||''} / ${d.firmaAtiende.documento}` }, { label:'Atiende — Fecha', value:formatFechaCorta(d.firmaAtiende.fecha) },
      ]},
    ];
  }

  if (slug === 'carta-responsabilidad') {
    return [
      { titulo:'1. DATOS DEL MANDANTE', columns:2, rows:[
        { label:'Nombre / Razón Social', value:d.mandante.nombreRazonSocial }, { label:'NIT / CC', value:d.mandante.nitCc }, { label:'Representante Legal', value:d.mandante.representanteLegal },
        { label:'Documento R.L.', value:d.mandante.tipoNumeroDocumentoRL }, { label:'Dirección', value:d.mandante.direccion }, { label:'Ciudad', value:d.mandante.ciudad },
        { label:'Teléfono', value:d.mandante.telefono }, { label:'Correo electrónico', value:d.mandante.email },
      ]},
      { titulo:'2. DESCRIPCIÓN DEL MANDATO', columns:2, rows:[
        { label:'Tipo de operación', value:(d.mandato.tipoOperacion||[]).join(', ') }, { label:'Tipo de carga', value:d.mandato.tipoCarga }, { label:'Productos a manejar', value:d.mandato.productos },
        { label:'Origen frecuente', value:d.mandato.origenFrecuente }, { label:'Destino frecuente', value:d.mandato.destinoFrecuente }, { label:'Incoterm habitual', value:d.mandato.incoterm },
      ]},
      { titulo:'3. DECLARACIÓN DE RESPONSABILIDAD', paragraphs:[
        `Declaración de procedencia lícita: ${d.declaracion.declaraProcedenciaLicita?'ACEPTADA':'NO ACEPTADA'}`, `Compromiso de información veraz: ${d.declaracion.comprometeInformacion?'ACEPTADO':'NO ACEPTADO'}`, `Autorización de mandato como agente de carga: ${d.declaracion.autorizaMandato?'ACEPTADA':'NO ACEPTADA'}`,
      ]},
      { titulo:'FIRMA', columns:2, rows:[{ label:'Nombre', value:d.firma.nombre }, { label:'Documento', value:d.firma.documento }, { label:'Fecha', value:formatFechaCorta(d.firma.fecha) }, { label:'Ciudad', value:d.firma.ciudad }] },
    ];
  }

  return [];
}

function generarPdf(slug, datos, descargar) {
  const config = FORM_CONFIGS[slug];
  const secciones = construirSeccionesPDF(slug, datos);
  const doc = new jsPDF({ unit:'mm', format:'a4' });
  const pageWidth = doc.internal.pageSize.getWidth();
  const pageHeight = doc.internal.pageSize.getHeight();
  const margenX = 12;
  const anchoContenido = pageWidth - margenX * 2;
  let y = 0;
  let primeraPagina = true;

  function dibujarBandaSuperior() {
    doc.setFillColor(...ROJO);
    doc.rect(0, 0, pageWidth, primeraPagina ? 16 : 8, 'F');
    doc.setTextColor(255,255,255);
    if (primeraPagina) {
      doc.setFontSize(11); doc.setFont(undefined,'bold');
      doc.text(EMPRESA.razonSocial, margenX, 7);
      doc.setFontSize(7.5); doc.setFont(undefined,'normal');
      doc.text(EMPRESA.actividad, margenX, 12);
      doc.setFontSize(7.5);
      doc.text(`${config.codigo} · V.01`, pageWidth - margenX, 7, { align:'right' });
      doc.text(`Fecha: ${new Date().toLocaleDateString('es-CO')}`, pageWidth - margenX, 12, { align:'right' });
    } else {
      doc.setFontSize(7); doc.text(`${EMPRESA.razonSocial} — continuación — ${config.codigo}`, margenX, 5.5);
    }
  }

  function nuevaPagina() {
    doc.addPage();
    primeraPagina = false;
    dibujarBandaSuperior();
    y = 14;
  }

  function asegurarEspacio(alto) {
    if (y + alto > pageHeight - 18) nuevaPagina();
  }

  // Página 1: banda + título
  dibujarBandaSuperior();
  y = 22;
  doc.setTextColor(...NEGRO); doc.setFontSize(12.5); doc.setFont(undefined,'bold');
  doc.text(config.titulo, pageWidth/2, y, { align:'center', maxWidth: anchoContenido });
  y += 5.5;
  doc.setFontSize(9); doc.setTextColor(...ROJO);
  doc.text(config.subtitulo || '', pageWidth/2, y, { align:'center' });
  y += 7;

  secciones.forEach((seccion) => {
    asegurarEspacio(9);
    doc.setFillColor(...ROJO);
    doc.rect(margenX, y, anchoContenido, 6.5, 'F');
    doc.setTextColor(255,255,255); doc.setFontSize(9.5); doc.setFont(undefined,'bold');
    doc.text(seccion.titulo, margenX + 2, y + 4.5);
    doc.setFont(undefined,'normal');
    y += 6.5;

    if (seccion.paragraphs) {
      seccion.paragraphs.forEach((p) => {
        if (!p) return;
        const lineas = doc.splitTextToSize(p, anchoContenido - 6);
        const alto = lineas.length * 4.2 + 4;
        asegurarEspacio(alto);
        doc.setFillColor(...GRIS_CLARO);
        doc.rect(margenX, y, anchoContenido, alto, 'F');
        doc.setFontSize(8); doc.setTextColor(...NEGRO);
        doc.text(lineas, margenX + 3, y + 5);
        y += alto;
      });
    }

    if (seccion.rows) {
      const columnas = seccion.columns || 1;
      if (columnas === 2) {
        for (let i = 0; i < seccion.rows.length; i += 2) {
          const alto = 5.8;
          asegurarEspacio(alto);
          const par = [seccion.rows[i], seccion.rows[i+1]];
          par.forEach((row, idx) => {
            if (!row) return;
            const x = margenX + idx * (anchoContenido/2);
            const w = anchoContenido/2;
            doc.setFillColor(...(((i/2)%2===0)?[248,248,248]:[255,255,255]));
            doc.rect(x, y, w, alto, 'F');
            doc.setFontSize(7); doc.setTextColor(...GRIS);
            doc.text(String(row.label), x + 2, y + 2.6);
            doc.setFontSize(7.8); doc.setTextColor(...NEGRO);
            const valorTexto = doc.splitTextToSize(String(row.value || '—'), w - 4)[0] || '';
            doc.text(valorTexto, x + 2, y + 5.2);
          });
          doc.setDrawColor(...GRIS_BORDE);
          doc.rect(margenX, y, anchoContenido, alto);
          doc.line(margenX + anchoContenido/2, y, margenX + anchoContenido/2, y + alto);
          y += alto;
        }
      } else {
        seccion.rows.forEach((row, idx) => {
          const lineasValor = doc.splitTextToSize(String(row.value || '—'), anchoContenido - 6);
          const alto = Math.max(5.5, lineasValor.length * 3.6 + 3.5);
          asegurarEspacio(alto);
          doc.setFillColor(...(idx % 2 === 0 ? [248,248,248] : [255,255,255]));
          doc.rect(margenX, y, anchoContenido, alto, 'F');
          doc.setFontSize(7.3); doc.setTextColor(...GRIS); doc.setFont(undefined,'bold');
          doc.text(String(row.label), margenX + 2, y + 3.4, { maxWidth: anchoContenido - 4 });
          doc.setFont(undefined,'normal'); doc.setFontSize(7.6); doc.setTextColor(...NEGRO);
          doc.text(lineasValor, margenX + 2, y + (row.label ? 3.4 + 3.4 : 3.4));
          y += alto;
        });
      }
      doc.setDrawColor(...GRIS_BORDE);
    }
    y += 3;
  });

  // Pie de página en todas las páginas
  const totalPaginas = doc.internal.getNumberOfPages();
  for (let i = 1; i <= totalPaginas; i++) {
    doc.setPage(i);
    doc.setDrawColor(...ROJO); doc.setLineWidth(0.3);
    doc.line(margenX, pageHeight - 12, pageWidth - margenX, pageHeight - 12);
    doc.setFontSize(6.5); doc.setTextColor(...NEGRO);
    doc.text(`${EMPRESA.razonSocial} | NIT ${EMPRESA.nit} | ${EMPRESA.direccion}`, margenX, pageHeight - 8);
    doc.text(`Pág ${i} de ${totalPaginas}`, pageWidth - margenX, pageHeight - 8, { align:'right' });
    doc.setFontSize(6); doc.setTextColor(120,120,120);
    doc.text('Este documento es confidencial y de uso exclusivo para el SAGRILAFT de TI Cargo', pageWidth/2, pageHeight - 4, { align:'center' });
  }

  if (descargar) {
    doc.save(`${config.codigo}_${slug}_${new Date().getTime()}.pdf`);
    return null;
  }
  return doc.output('datauristring');
}
</script>

<script type="text/babel" data-presets="react">
/* ============================================================
   7. VALIDACIÓN GENÉRICA POR SECCIÓN
   ============================================================ */
function validarSeccion(fields, datos) {
  for (const f of fields) {
    if (f.showIf && !f.showIf(datos)) continue;
    if (f.type === 'dynamicList' || f.type === 'matrix' || f.type === 'staticText' || f.type === 'signature') continue;
    if (!f.required) continue;
    const val = getPath(datos, f.name);
    if (f.type === 'checkbox' && !val) return `Debe aceptar: "${f.label.slice(0, 70)}..."`;
    if (f.type === 'checkboxGroup' && (!val || val.length === 0)) return `Seleccione al menos una opción en "${f.label}"`;
    if (f.type === 'currency' && (val === undefined || val === null)) return `Complete el campo "${f.label}"`;
    if (['text','email','url','textarea','date','select','radio','number'].includes(f.type) && (val === undefined || val === null || val === '')) {
      return `Complete el campo "${f.label}"`;
    }
  }
  return null;
}

/* ============================================================
   8. PÁGINA DE FORMULARIO (genérica para los 7)
   ============================================================ */
function FormPage({ slug, onVolver }) {
  const config = FORM_CONFIGS[slug];
  const [datos, setDatos] = useState(() => config.initial());
  const [seccionActiva, setSeccionActiva] = useState(0);
  const [error, setError] = useState('');
  const [previewUrl, setPreviewUrl] = useState(null);
  const [toast, setToast] = useState('');

  useEffect(() => {
    const borrador = leerBorrador(config.codigo);
    if (borrador) {
      const continuar = window.confirm(`Encontramos un borrador guardado el ${new Date(borrador.savedAt).toLocaleString('es-CO')}. ¿Desea continuar con ese borrador?`);
      if (continuar) setDatos(borrador.data);
    }
    // eslint-disable-next-line
  }, [slug]);

  function mostrarToast(msg) {
    setToast(msg);
    setTimeout(() => setToast(''), 3000);
  }

  function set(path, value) {
    setDatos((prev) => setPath(prev, path, value));
  }

  function guardarBorradorActual() {
    guardarBorrador(config.codigo, datos);
    mostrarToast('Borrador guardado correctamente.');
  }

  function validarTodo() {
    for (const s of config.sections) {
      const msg = validarSeccion(s.fields, datos);
      if (msg) return msg;
    }
    return null;
  }

  function irSiguiente() {
    const msg = validarSeccion(config.sections[seccionActiva].fields, datos);
    if (msg) { setError(msg); return; }
    setError('');
    setSeccionActiva((s) => Math.min(config.sections.length - 1, s + 1));
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function irAnterior() {
    setError('');
    setSeccionActiva((s) => Math.max(0, s - 1));
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function onGenerarPdf() {
    const msg = validarTodo();
    if (msg) { setError(msg); mostrarToast('Complete los campos obligatorios antes de generar el PDF.'); return; }
    setError('');
    generarPdf(slug, datos, true);
    marcarCompletado(config.codigo);
    mostrarToast('PDF generado y descargado correctamente.');
  }

  function onVistaPrevia() {
    const dataUri = generarPdf(slug, datos, false);
    setPreviewUrl(dataUri);
  }

  const seccion = config.sections[seccionActiva];
  const porcentaje = Math.round(((seccionActiva + 1) / config.sections.length) * 100);

  return (
    <div>
      <div className="mb-5 flex flex-wrap items-center justify-between gap-3">
        <div>
          <p className="text-[11px] font-semibold uppercase tracking-wide text-ticargo-red">{config.codigo}</p>
          <h1 className="text-xl font-semibold text-ticargo-black">{config.titulo}</h1>
        </div>
        <div className="flex flex-wrap gap-2">
          <button onClick={guardarBorradorActual} className="flex items-center gap-1.5 rounded-md border border-ticargo-border bg-white px-3 py-2 text-sm font-medium text-ticargo-black/70 hover:bg-ticargo-gray">
            <IconSave size={15} /> Guardar Borrador
          </button>
          <button onClick={onVistaPrevia} className="flex items-center gap-1.5 rounded-md border border-ticargo-border bg-white px-3 py-2 text-sm font-medium text-ticargo-black/70 hover:bg-ticargo-gray">
            <IconEye size={15} /> Vista previa
          </button>
          <button onClick={onGenerarPdf} className="flex items-center gap-1.5 rounded-md bg-ticargo-red px-4 py-2 text-sm font-semibold text-white hover:bg-ticargo-redDark">
            <IconDownload size={15} /> Generar PDF
          </button>
        </div>
      </div>

      {error && <div className="mb-4 rounded-lg border border-red-200 bg-red-50 px-3 py-2 text-sm text-ticargo-red">{error}</div>}

      <div className="mb-2 flex items-center justify-between text-xs text-ticargo-black/60">
        <span>Sección {seccionActiva + 1} de {config.sections.length}</span>
        <span>{porcentaje}% completado</span>
      </div>
      <div className="mb-3 h-1.5 w-full overflow-hidden rounded-full bg-ticargo-gray">
        <div className="h-full bg-ticargo-red transition-all" style={{ width: `${porcentaje}%` }} />
      </div>
      <div className="mb-5 flex flex-wrap gap-2">
        {config.sections.map((s, idx) => (
          <button key={s.titulo} onClick={() => setSeccionActiva(idx)}
            className={`rounded-full border px-3 py-1 text-xs font-medium transition-colors ${idx===seccionActiva ? 'border-ticargo-red bg-ticargo-red text-white' : idx<seccionActiva ? 'border-green-300 bg-green-50 text-green-700' : 'border-ticargo-border bg-white text-ticargo-black/60'}`}>
            {idx+1}. {s.titulo}
          </button>
        ))}
      </div>

      <div className="rounded-xl border border-ticargo-border bg-white p-5">
        <h2 className="mb-4 text-base font-semibold text-ticargo-black">{seccion.titulo}</h2>
        <div className="grid grid-cols-1 gap-4 sm:grid-cols-2">
          {seccion.fields.map((field) => <Campo key={field.name} field={field} datos={datos} set={set} />)}
        </div>
      </div>

      <div className="mt-4 flex justify-between">
        <button disabled={seccionActiva===0} onClick={irAnterior} className="flex items-center gap-1 rounded-md border border-ticargo-border px-4 py-2 text-sm font-medium text-ticargo-black/70 hover:bg-ticargo-gray disabled:cursor-not-allowed disabled:opacity-40">
          <IconChevronLeft size={16} /> Anterior
        </button>
        {seccionActiva < config.sections.length - 1 && (
          <button onClick={irSiguiente} className="flex items-center gap-1 rounded-md bg-ticargo-black px-4 py-2 text-sm font-medium text-white hover:bg-black">
            Siguiente sección <IconChevronRight size={16} />
          </button>
        )}
      </div>

      {previewUrl && (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4" onClick={() => setPreviewUrl(null)}>
          <div className="h-[90vh] w-full max-w-4xl overflow-hidden rounded-lg bg-white" onClick={(e) => e.stopPropagation()}>
            <div className="flex items-center justify-between border-b border-ticargo-border px-4 py-2">
              <p className="text-sm font-semibold text-ticargo-black">Vista previa del PDF</p>
              <button onClick={() => setPreviewUrl(null)} className="text-ticargo-black/60 hover:text-ticargo-red"><IconX size={18} /></button>
            </div>
            <iframe src={previewUrl} className="h-full w-full" title="Vista previa" />
          </div>
        </div>
      )}

      {toast && (
        <div className="fixed bottom-4 right-4 z-50 rounded-lg bg-ticargo-black px-4 py-3 text-sm text-white shadow-lg">{toast}</div>
      )}
    </div>
  );
}

/* ============================================================
   9. DASHBOARD
   ============================================================ */
const ESTADO_UI = {
  nuevo: { label: 'Nuevo', icon: IconCircle, className: 'text-ticargo-black/40' },
  'en-progreso': { label: 'En progreso', icon: IconCircleDot, className: 'text-amber-600' },
  completado: { label: 'Completado', icon: IconCircleCheck, className: 'text-green-600' },
};

function FormCard({ f, onAbrir }) {
  const [estado, setEstado] = useState('nuevo');
  useEffect(() => { setEstado(estadoFormulario(f.codigo)); }, [f.codigo]);
  const info = ESTADO_UI[estado];
  const EstadoIcon = info.icon;
  return (
    <button onClick={() => onAbrir(f.slug)} className="group flex flex-col justify-between rounded-xl border border-ticargo-border bg-white p-5 text-left shadow-sm transition-shadow hover:shadow-md">
      <div>
        <div className="mb-3 flex items-center justify-between">
          <span className="flex h-10 w-10 items-center justify-center rounded-lg bg-ticargo-red/10 text-ticargo-red"><IconFile size={20} /></span>
          <span className={`flex items-center gap-1 text-xs font-medium ${info.className}`}><EstadoIcon size={12} /> {info.label}</span>
        </div>
        <p className="text-[11px] font-semibold uppercase tracking-wide text-ticargo-black/40">{f.codigo}</p>
        <h3 className="mt-1 text-base font-semibold text-ticargo-black">{f.titulo}</h3>
        <p className="mt-1.5 text-sm text-ticargo-black/60">{f.descripcion}</p>
      </div>
      <div className="mt-4 flex items-center gap-1 text-sm font-medium text-ticargo-red">
        Diligenciar <IconChevronRight size={15} className="transition-transform group-hover:translate-x-0.5" />
      </div>
    </button>
  );
}

function Dashboard({ onAbrir }) {
  return (
    <div>
      <div className="mb-6 flex items-start gap-3 rounded-xl bg-ticargo-black p-5 text-white sm:p-6">
        <IconShield size={28} className="mt-0.5 shrink-0 text-ticargo-red" />
        <div>
          <h1 className="text-lg font-semibold sm:text-xl">Portal de Vinculación SAGRILAFT — {EMPRESA.razonSocial}</h1>
          <p className="mt-1 text-sm text-white/70">Diligencie digitalmente los formularios de vinculación, genere el PDF oficial y guárdelo o envíelo a su contacto en TI Cargo. Oficial de Cumplimiento: {EMPRESA.oficialCumplimiento}.</p>
        </div>
      </div>
      <div className="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3">
        {FORMULARIOS.map((f) => <FormCard key={f.slug} f={f} onAbrir={onAbrir} />)}
      </div>
    </div>
  );
}

/* ============================================================
   10. APP RAÍZ (ruteo por hash)
   ============================================================ */
function App() {
  const [ruta, setRuta] = useState(window.location.hash || '#/');
  useEffect(() => {
    const onHash = () => setRuta(window.location.hash || '#/');
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  const slug = ruta.startsWith('#/') ? ruta.slice(2) : '';
  const irA = (s) => { window.location.hash = `#/${s}`; };

  return (
    <div className="min-h-screen bg-ticargo-gray">
      <header className="sticky top-0 z-30 flex h-16 items-center justify-between bg-ticargo-red px-4 shadow-md sm:px-6">
        <button onClick={() => irA('')} className="flex items-center gap-3">
          <div className="flex items-center gap-1.5 rounded bg-white px-2.5 py-1.5">
            <IconShield size={18} className="text-ticargo-red" />
            <span className="text-sm font-bold text-ticargo-red">TI CARGO</span>
          </div>
        </button>
        <div className="hidden text-right text-white sm:block">
          <p className="text-sm font-semibold leading-tight">{EMPRESA.razonSocial}</p>
          <p className="text-xs leading-tight text-white/85">Portal de Vinculación SAGRILAFT</p>
        </div>
      </header>

      <div className="mx-auto flex max-w-7xl">
        <aside className="sticky top-16 hidden h-[calc(100vh-4rem)] w-64 shrink-0 overflow-y-auto bg-ticargo-black md:block">
          <nav className="flex flex-col gap-1 p-3">
            <button onClick={() => irA('')} className={`flex items-center gap-2 rounded-md px-3 py-2 text-left text-sm font-medium ${!slug ? 'bg-ticargo-red text-white' : 'text-white/80 hover:bg-white/10 hover:text-white'}`}>
              <IconLayout size={16} /> Dashboard
            </button>
            <p className="mt-3 px-3 text-[11px] font-semibold uppercase tracking-wide text-white/40">Formularios SAGRILAFT</p>
            {FORMULARIOS.map((f) => (
              <button key={f.slug} onClick={() => irA(f.slug)} className={`flex items-start gap-2 rounded-md px-3 py-2 text-left text-sm ${slug===f.slug ? 'bg-ticargo-red text-white' : 'text-white/80 hover:bg-white/10 hover:text-white'}`}>
                <IconFile size={16} className="mt-0.5 shrink-0" />
                <span><span className="block leading-tight">{f.titulo}</span><span className="block text-[10px] text-white/50">{f.codigo}</span></span>
              </button>
            ))}
          </nav>
        </aside>

        <main className="min-h-[calc(100vh-4rem)] flex-1 px-4 py-6 sm:px-6">
          {slug && FORM_CONFIGS[slug] ? <FormPage slug={slug} onVolver={() => irA('')} /> : <Dashboard onAbrir={irA} />}
        </main>
      </div>

      <footer className="border-t border-ticargo-border bg-white px-4 py-4 text-center text-xs text-ticargo-black/60 sm:px-6">
        {EMPRESA.razonSocial} · NIT {EMPRESA.nit} · {EMPRESA.direccion} · {EMPRESA.telefono}
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
