<script type="text/babel" data-presets="react">
const PM = 40, PW = 532, PTOP = 112, PBOT = 740;
const RED = [193, 39, 45], INK = [29, 29, 27], GRAYF = [236, 236, 236];

function S(s) {
  return String(s == null ? '' : s).replace(/[–—]/g, '-').replace(/[“”«»]/g, '"').replace(/[‘’]/g, "'")
    .replace(/[•·]/g, '-').replace(/…/g, '...').replace(/[^\x00-\xFF]/g, '');
}
function newPDF(meta) {
  const doc = new window.jspdf.jsPDF({ unit: 'pt', format: 'letter' });
  return { doc, meta, y: PTOP, fs: 9 };
}
function ensure(c, h) { if (c.y + h > PBOT) { c.doc.addPage(); c.y = PTOP; } }
function wrap(c, t, w, size, bold) {
  c.doc.setFont('helvetica', bold ? 'bold' : 'normal'); c.doc.setFontSize(size);
  return c.doc.splitTextToSize(S(t), w);
}
function gap(c, h) { c.y += h; }
function para(c, t, o) {
  o = o || {};
  const size = o.size || c.fs, w = (o.w || PW) - (o.indent || 0), lh = size * 1.3;
  const ls = wrap(c, t, w, size, o.bold);
  const col = o.color || INK;
  ls.forEach(l => {
    ensure(c, lh);
    c.doc.setFont('helvetica', o.bold ? 'bold' : (o.italic ? 'italic' : 'normal')); c.doc.setFontSize(size); c.doc.setTextColor(col[0], col[1], col[2]);
    const x = o.align === 'center' ? PM + PW / 2 : o.align === 'right' ? PM + PW : PM + (o.indent || 0);
    c.doc.text(l, x, c.y + size, { align: o.align || 'left' });
    c.y += lh;
  });
  c.y += (o.after != null ? o.after : 3);
}
function bullet(c, t, o) {
  o = o || {};
  const size = o.size || c.fs;
  ensure(c, size * 1.3);
  c.doc.setFont('helvetica', 'normal'); c.doc.setFontSize(size); c.doc.setTextColor(INK[0], INK[1], INK[2]);
  c.doc.text(o.mark || '-', PM + 8, c.y + size);

}
// cells: [{t,w,b,fill,color,align}] w en fraccion
function row(c, cells, o) {
  o = o || {};
  const size = o.size || c.fs, pad = 3, lh = size * 1.25;
  const L = cells.map(ce => wrap(c, ce.t, ce.w * PW - pad * 2, size, ce.b));
  const h = Math.max(o.minH || 0, Math.max.apply(null, L.map(l => l.length)) * lh + pad * 2);
  ensure(c, h);
  let x = PM;
  cells.forEach((ce, i) => {
    const cw = ce.w * PW;
    c.doc.setDrawColor(110, 110, 110); c.doc.setLineWidth(.5);
    if (ce.fill) { c.doc.setFillColor(ce.fill[0], ce.fill[1], ce.fill[2]); c.doc.rect(x, c.y, cw, h, 'FD'); } else c.doc.rect(x, c.y, cw, h);

    const col = ce.color || INK; c.doc.setTextColor(col[0], col[1], col[2]);
    const tx = ce.align === 'center' ? x + cw / 2 : x + pad;
    L[i].forEach((ln, k) => c.doc.text(ln, tx, c.y + pad + size + k * lh - 1, { align: ce.align === 'center' ? 'center' : 'left' }));
    x += cw;
  });
  c.y += h;
}
function bar(c, title) {

  row(c, [{ t: title, w: 1, b: true, fill: RED, color: [255, 255, 255] }], { size: c.fs + 0.5 });
}
// pares [[label,valor],...] en n columnas
function kv(c, pairs, cols) {
  cols = cols || 2;
  const lw = cols === 1 ? 0.3 : cols === 2 ? 0.17 : 0.11, vw = cols === 1 ? 0.7 : cols === 2 ? 0.33 : 0.2233;
  for (let i = 0; i < pairs.length; i += cols) {
    const cells = [];
    for (let j = 0; j < cols; j++) {
      const p = pairs[i + j];
      cells.push({ t: p ? p[0] : '', w: lw, b: true, fill: GRAYF });
      cells.push({ t: p ? p[1] : '', w: vw });
    }
    row(c, cells);
  }
}
// tabla con encabezados; widths fracciones; rows arrays de strings
function tbl(c, headers, widths, rows, minRows) {
  row(c, headers.map((h, i) => ({ t: h, w: widths[i], b: true, fill: GRAYF, align: 'center' })));
  const data = rows.slice();
  while (data.length < (minRows || 0)) data.push(headers.map(() => ''));

}
const chk = (v) => v ? '[X]' : '[  ]';
const yn = (v) => v === 'Sí' ? 'SI [X]  NO [  ]' : v === 'No' ? 'SI [  ]  NO [X]' : 'SI [  ]  NO [  ]';

function sigBlocks(c, blocks, o) {

const B = function () { for (let i = 0; i < arguments.length; i++) { const x = arguments[i]; if (x !== undefined && x !== null && x !== '') return String(x); } return ''; };
const LINE = '______________________';

function pdfMandato(f) {

};

function Field({ label, value, onChange, type, options, rows, span, placeholder, readOnly, hint }) {
  const sp = span === 3 ? 'md:col-span-3' : span === 2 ? 'md:col-span-2' : '';
  let el;
  if (options) {
    el = (<select className={inputCls} value={value || ''} onChange={e => onChange(e.target.value)} disabled={readOnly}>
      <option value="">Seleccione...</option>{options.map(o => <option key={o} value={o}>{o}</option>)}</select>);
  } else if (rows) {
    el = <textarea className={inputCls} rows={rows} value={value || ''} placeholder={placeholder} onChange={e => onChange(e.target.value)} disabled={readOnly} />;
  } else {
    el = <input className={inputCls} type={type || 'text'} value={value == null ? '' : value} placeholder={placeholder} onChange={e => onChange(e.target.value)} disabled={readOnly} />;
  }
  return (<label className={'block ' + sp}><span className="block text-xs font-semibold text-gray-600 mb-1">{label}</span>{el}{hint && <span className="block text-[11px] text-gray-400 mt-0.5">{hint}</span>}</label>);
}

function YN({ label, value, onChange, options, span, readOnly }) {
  const opts = options || ['Sí', 'No'];
  const sp = span === 3 ? 'md:col-span-3' : span === 2 ? 'md:col-span-2' : '';
  return (<div className={sp}>
    <span className="block text-xs font-semibold text-gray-600 mb-1">{label}</span>
    <div className="flex gap-2 flex-wrap">
      {opts.map(o => (<button type="button" key={o} disabled={readOnly} onClick={() => onChange(value === o ? '' : o)}

    </div>
  </div>);
}

function Check({ label, checked, onChange }) {

}

function Stepper({ step, onGo, maxStep }) {
  const steps = ['Tipo de vinculación', 'Formulario único', 'Generar documentos', 'Subir documentos'];
  return (<div className="card p-3 md:p-4 mb-4">
    <div className="flex items-center">
      {steps.map((s, i) => {
        const n = i + 1, done = n < step, cur = n === step;
        return (<React.Fragment key={s}>
          <button disabled={n > maxStep} onClick={() => onGo(n)} className="flex flex-col md:flex-row items-center gap-1 md:gap-2 disabled:cursor-not-allowed">
            <span className={'h-8 w-8 rounded-full grid place-items-center text-sm font-bold ' + (cur ? 'bg-[#C1272D] text-white ring-4 ring-red-100' : done ? 'bg-[#1D1D1B] text-white' : 'bg-gray-200 text-gray-500')}>{done ? '✓' : n}</span>
            <span className={'text-[11px] md:text-sm text-center ' + (cur ? 'font-bold text-[#C1272D]' : 'text-gray-600')}>{s}</span>
          </button>
          {i < steps.length - 1 && <div className={'flex-1 h-0.5 mx-2 ' + (done ? 'bg-[#1D1D1B]' : 'bg-gray-200')} />}
        </React.Fragment>);
      })}
    </div>
  </div>);
}

function ClientPortal({ onExit }) {
  const [step, setStep] = useState(1);
  const [maxStep, setMaxStep] = useState(1);
  const [tipo, setTipo] = useState('Nueva');
  const [nitQ, setNitQ] = useState('');
  const [msg, setMsg] = useState(null);
  const [form, setForm] = useState(emptyForm());
  const [files, setFiles] = useState({});
  const [started, setStarted] = useState(false);
  const [draft, setDraft] = useState(() => LS.get(KEY_DRAFT, null));
  const [loaded, setLoaded] = useState(false);
  const [saved, setSaved] = useState('');
  const [done, setDone] = useState(false);
  const [uploadMode, setUploadMode] = useState('separado');
  const [warn, setWarn] = useState('');
  const set = useCallback((path, val) => setForm(f => setIn(f, path, val)), []);
  const nit = normNit(form.gen.nit);

  // Autoguardado de borrador
  useEffect(() => {
    if (!started) return;
    const t = setTimeout(() => { LS.set(KEY_DRAFT, { form, tipo, step, ts: Date.now() }); setSaved(new Date().toLocaleTimeString('es-CO')); }, 400);
    return () => clearTimeout(t);
  }, [form, tipo, step, started]);

  const go = (n) => { setStep(n); setMaxStep(m => Math.max(m, n)); window.scrollTo({ top: 0, behavior: 'smooth' }); };

  const resume = () => { setForm(mergeForm(draft.form)); setTipo(draft.tipo || 'Nueva'); setStarted(true); setLoaded(true); setDraft(null); const s = Math.min(draft.step || 2, 2); setMaxStep(2); setStep(Math.max(s, 2)); };
  const discard = () => { LS.del(KEY_DRAFT); setDraft(null); };

  const lookup = () => {
    const all = getClients();
    const k = Object.keys(all).find(x => sameNit(x, nitQ));
    if (!k) { setMsg({ t: 'err', m: 'No se encontró ningún cliente con ese NIT. Verifique el número o seleccione "Vinculación nueva".' }); setLoaded(false); return; }
    setForm(mergeForm(all[k].data)); setFiles(all[k].files || {}); setLoaded(true);
    setMsg({ t: 'ok', m: 'Datos cargados: ' + all[k].razon + '. Revise y actualice la información en el siguiente paso.' });
  };

  const start = () => {
    if (tipo === 'Actualización' && !loaded) { setMsg({ t: 'err', m: 'Busque y cargue primero el NIT del cliente a actualizar.' }); return; }
    if (tipo === 'Nueva' && !started) setForm(emptyForm());
    setStarted(true); go(2);
  };

  const saveForm = () => {
    if (!form.gen.razon.trim() || !nit) { alert('Complete al menos Razón social y NIT (Sección A) para continuar.'); return; }
    const all = getClients();
    const exist = Object.keys(all).find(x => sameNit(x, form.gen.nit));
    const key = exist || nit;
    const patch = { razon: form.gen.razon, data: form };
    if (exist) { patch.tipo = tipo === 'Actualización' ? 'Actualización' : all[exist].tipo; patch.fechaActualizacion = todayISO(); patch._log = { accion: tipo === 'Actualización' ? 'Actualización de información por el cliente' : 'Formulario re-diligenciado por el cliente', nota: '' }; if (all[exist].estado === 'Aprobado') patch.estado = 'En revisión'; }
    else { patch.tipo = 'Nueva'; patch.fechaVinc = todayISO(); patch._log = { accion: 'Vinculación nueva registrada por el cliente', nota: '' }; }
    if (!upsertClient(key, patch)) { alert('No se pudo guardar: el almacenamiento local está lleno. Elimine datos o documentos grandes.'); return; }
    if (!exist) setFiles({});
    else setFiles(all[exist].files || {});
    go(3);
  };
  const recKey = () => { const all = getClients(); return Object.keys(all).find(x => sameNit(x, form.gen.nit)) || nit; };

  const persistFiles = (nf) => {
    if (!upsertClient(recKey(), { files: nf })) { alert('Almacenamiento local lleno. No se pudo guardar el archivo; use un archivo más pequeño.'); return false; }
    setFiles(nf);
    const mb = LS.size() / 1048576;
    setWarn(mb > 3.5 ? 'Atención: el almacenamiento local está al ' + Math.min(100, Math.round(mb / 5 * 100)) + '% (aprox. ' + mb.toFixed(1) + ' MB de 5 MB).' : '');
    return true;
  };
  const readFile = (file) => new Promise((res) => {
    if (file.size > MAX_FILE && !confirm('"' + file.name + '" pesa ' + (file.size / 1048576).toFixed(1) + ' MB. El almacenamiento local es limitado (~5 MB en total). ¿Desea intentarlo de todas formas?')) return res(null);
    const r = new FileReader();
    r.onload = () => res({ name: file.name, type: file.type, size: file.size, data: r.result, date: todayISO() });
    r.onerror = () => res(null);
    r.readAsDataURL(file);
  });
  const uploadOne = async (key, file) => { if (!file) return; const o = await readFile(file); if (o) persistFiles(Object.assign({}, files, { [key]: o })); };
  const uploadMany = async (list) => {
    let nf = Object.assign({}, files);
    const pend = DOCS_REQ.map(d => d.key).filter(k => !nf[k]);
    let extra = Object.keys(nf).filter(k => k.startsWith('otro_')).length;
    for (const file of Array.from(list)) {
      const o = await readFile(file); if (!o) continue;
      if (pend.length) nf[pend.shift()] = o; else nf['otro_' + (++extra)] = o;
    }
    persistFiles(nf);
  };
  const removeFile = (k) => { const nf = Object.assign({}, files); delete nf[k]; persistFiles(nf); };
  const finish = () => {
    upsertClient(recKey(), { estado: 'En revisión', _log: { accion: 'Cliente finalizó el trámite y envió documentos a revisión', nota: Object.keys(files).length + ' archivo(s) cargado(s)' } });
    LS.del(KEY_DRAFT); setDone(true);
  };

  if (done) return (<div className="min-h-screen"><Header title="Portal Cliente" onBack={onExit} />
    <div className="max-w-xl mx-auto p-6 mt-10 card text-center fade-in">
      <div className="mx-auto h-16 w-16 rounded-full bg-green-100 text-green-600 grid place-items-center text-3xl mb-4">✓</div>
      <h2 className="text-xl font-bold mb-2">¡Trámite enviado!</h2>
      <p className="text-gray-600 text-sm mb-6">Su información y documentos fueron registrados para <b>{form.gen.razon}</b>. El Oficial de Cumplimiento de TI Cargo revisará su solicitud y se pondrá en contacto con usted.</p>
      <p className="text-xs text-gray-500 mb-6">Consultas: {CO.email} · {CO.tel}</p>
      <button className="btn btn-primary" onClick={onExit}>Volver al inicio</button></div></div>);

  const missing = DOCS_REQ.filter(d => !files[d.key]).length;

  return (<div className="min-h-screen pb-24">
    <Header title="Portal Cliente · Vinculación SAGRILAFT" onBack={onExit} right={started && saved ? <span className="text-[11px] text-gray-400 hidden md:inline">Borrador guardado {saved}</span> : null} />
    <main className="max-w-5xl mx-auto px-3 md:px-4 py-5">
      <Stepper step={step} onGo={go} maxStep={maxStep} />

      {step === 1 && (<div className="card p-5 md:p-7 fade-in">
        <h2 className="text-lg md:text-xl font-bold mb-1">Tipo de vinculación</h2>
        <p className="text-sm text-gray-500 mb-5">Diligencie su información una sola vez; con ella generamos todos los formatos requeridos.</p>
        {draft && (<div className="mb-5 p-4 rounded-xl bg-amber-50 border border-amber-200 flex flex-col md:flex-row md:items-center gap-3">
          <div className="flex-1 text-sm"><b>Tiene un borrador guardado</b>{draft.form && draft.form.gen.razon ? ' de ' + draft.form.gen.razon : ''} ({new Date(draft.ts).toLocaleString('es-CO')}).</div>
          <button className="btn btn-primary" onClick={resume}>Continuar borrador</button><button className="btn btn-ghost" onClick={discard}>Descartar</button></div>)}
        <div className="grid md:grid-cols-2 gap-3">
          {[['Nueva', 'Vinculación Nueva', 'Primera vez que se vincula con TI Cargo.'], ['Actualización', 'Actualización', 'Ya es cliente y debe actualizar su información (mínimo anual).']].map(o => (
            <label key={o[0]} className={'cursor-pointer p-4 rounded-xl border-2 transition ' + (tipo === o[0] ? 'border-[#C1272D] bg-red-50' : 'border-gray-200 hover:border-gray-400')}>
              <input type="radio" className="accent-[#C1272D] mr-2" checked={tipo === o[0]} onChange={() => { setTipo(o[0]); setMsg(null); setLoaded(false); }} />
              <b>{o[1]}</b><p className="text-xs text-gray-500 mt-1 ml-5">{o[2]}</p></label>))}
        </div>
        {tipo === 'Actualización' && (<div className="mt-5 p-4 bg-gray-50 rounded-xl border fade-in">
          <label className="text-xs font-semibold text-gray-600">NIT del cliente</label>
          <div className="flex gap-2 mt-1"><input className={inputCls} placeholder="Ej: 805.005.709-6" value={nitQ} onChange={e => setNitQ(e.target.value)} onKeyDown={e => e.key === 'Enter' && lookup()} />
            <button className="btn btn-dark" onClick={lookup}>Buscar</button></div>
        </div>)}
        {msg && <div className={'mt-4 p-3 rounded-lg text-sm ' + (msg.t === 'ok' ? 'bg-green-50 text-green-800 border border-green-200' : 'bg-red-50 text-red-800 border border-red-200')}>{msg.m}</div>}
        <div className="mt-6 flex justify-end"><button className="btn btn-primary" onClick={start}>Continuar →</button></div>
      </div>)}

      {step === 2 && (<div className="fade-in">
        <div className="mb-3"><h2 className="text-lg md:text-xl font-bold">Formulario único</h2><p className="text-sm text-gray-500">Se guarda automáticamente mientras escribe. Los campos con * son obligatorios.</p></div>
        <FormUnico f={form} set={set} />
        <div className="flex justify-between mt-5">
          <button className="btn btn-ghost" onClick={() => go(1)}>← Atrás</button>
          <button className="btn btn-primary" onClick={saveForm}>Guardar y generar documentos →</button></div>
      </div>)}

      {step === 3 && (<div className="fade-in">
        <div className="mb-4 flex flex-col md:flex-row md:items-end gap-2">
          <div className="flex-1"><h2 className="text-lg md:text-xl font-bold">Generar documentos</h2><p className="text-sm text-gray-500">Los formatos se completan con la información que diligenció. Descárguelos, fírmelos y cárguelos en el siguiente paso.</p></div>
          <button className="btn btn-dark" onClick={() => GEN_DOCS.forEach((d, i) => setTimeout(() => downloadPDF(d.key, form, tipo), i * 700))}>⬇ Descargar todos</button>
        </div>
        <div className="grid md:grid-cols-2 gap-4">
          {GEN_DOCS.map(d => (<div key={d.key} className="card p-5 flex flex-col">
            <div className="flex items-start gap-3 flex-1">
              <div className="h-12 w-10 rounded bg-red-50 border border-red-200 text-[#C1272D] grid place-items-center text-[10px] font-bold">PDF</div>
              <div><div className="text-xs font-bold text-[#C1272D]">{d.codigo} · v{d.version}</div><div className="font-semibold text-sm">{d.titulo}</div></div>
            </div>
            <button className="btn btn-primary mt-4" onClick={() => downloadPDF(d.key, form, tipo)}>Descargar PDF</button>
          </div>))}
        </div>
        <div className="flex justify-between mt-5"><button className="btn btn-ghost" onClick={() => go(2)}>← Editar formulario</button><button className="btn btn-primary" onClick={() => go(4)}>Continuar a documentos →</button></div>
      </div>)}

      {step === 4 && (<div className="fade-in">
        <div className="mb-4"><h2 className="text-lg md:text-xl font-bold">Subir documentos</h2>
          <p className="text-sm text-gray-500">Adjunte los soportes requeridos (PDF o imagen). {DOCS_REQ.length - missing} de {DOCS_REQ.length} cargados.</p>
          <div className="h-2 bg-gray-200 rounded-full mt-2 overflow-hidden"><div className="h-full bg-[#C1272D] transition-all" style={{ width: ((DOCS_REQ.length - missing) / DOCS_REQ.length * 100) + '%' }} /></div></div>
        {warn && <div className="mb-3 p-3 rounded-lg bg-amber-50 border border-amber-200 text-sm text-amber-800">{warn}</div>}
        <div className="card p-4 mb-4">
          <div className="flex gap-2 mb-3">
            {[['todos', 'Subir todos los documentos'], ['separado', 'Subir por separado']].map(o => (
              <button key={o[0]} onClick={() => setUploadMode(o[0])} className={'flex-1 px-3 py-2 rounded-lg text-sm font-semibold border ' + (uploadMode === o[0] ? 'bg-[#1D1D1B] text-white border-[#1D1D1B]' : 'bg-white border-gray-300')}>{o[1]}</button>))}
          </div>
          {uploadMode === 'todos' && (<div className="fade-in"><input type="file" multiple accept=".pdf,image/*" onChange={e => { uploadMany(e.target.files); e.target.value = ''; }} className="block w-full text-sm border-2 border-dashed border-gray-300 rounded-xl p-4" />
            <p className="text-xs text-gray-500 mt-2">Los archivos se asignan en orden a los documentos pendientes de la lista. Puede reasignarlos o reemplazarlos subiéndolos por separado.</p></div>)}
        </div>
        <div className="space-y-2">
          {DOCS_REQ.map((d, i) => { const fl = files[d.key]; return (
            <div key={d.key} className={'card p-3 md:p-4 flex flex-col md:flex-row md:items-center gap-3 ' + (fl ? 'border-green-300' : '')}>
              <span className={'flex-none text-[11px] font-bold px-2 py-1 rounded-full w-fit ' + (fl ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700')}>{fl ? 'Cargado' : 'Pendiente'}</span>
              <div className="flex-1 min-w-0"><div className="text-sm font-medium">{i + 1}. {d.label}</div>{fl && <div className="text-xs text-gray-500 truncate">{fl.name} · {(fl.size / 1024).toFixed(0)} KB</div>}</div>
              <div className="flex items-center gap-2">
                <label className="btn btn-ghost cursor-pointer text-xs">{fl ? 'Reemplazar' : 'Seleccionar archivo'}<input type="file" accept=".pdf,image/*" className="hidden" onChange={e => { uploadOne(d.key, e.target.files[0]); e.target.value = ''; }} /></label>
                {fl && <button className="text-xs text-[#C1272D] hover:underline" onClick={() => removeFile(d.key)}>Quitar</button>}
              </div>
            </div>); })}
          {Object.keys(files).filter(k => k.startsWith('otro_')).map(k => (<div key={k} className="card p-3 flex items-center gap-3"><span className="text-[11px] font-bold px-2 py-1 rounded-full bg-blue-100 text-blue-700">Adicional</span><span className="flex-1 text-sm truncate">{files[k].name}</span><button className="text-xs text-[#C1272D]" onClick={() => removeFile(k)}>Quitar</button></div>))}
        </div>
        <div className="flex justify-between mt-5"><button className="btn btn-ghost" onClick={() => go(3)}>← Atrás</button>
          <button className="btn btn-primary" onClick={() => { if (missing && !confirm('Faltan ' + missing + ' documento(s). ¿Enviar de todas formas?')) return; finish(); }}>Finalizar y enviar</button></div>
      </div>)}
    </main>
  </div>);
}
</script>

<!-- ============ BLOQUE 5: ADMINISTRACION ============ -->
<script type="text/babel" data-presets="react">
const ESTADO_CLS = { 'Pendiente documentos': 'bg-amber-100 text-amber-800', 'En revisión': 'bg-blue-100 text-blue-800', 'Aprobado': 'bg-green-100 text-green-800', 'Rechazado': 'bg-red-100 text-red-800', 'Requiere información adicional': 'bg-purple-100 text-purple-800' };
const RIESGO_CLS = { 'Bajo': 'bg-green-100 text-green-800', 'Medio': 'bg-yellow-100 text-yellow-800', 'Alto': 'bg-red-100 text-red-800', 'No evaluado': 'bg-gray-100 text-gray-600' };
const Badge = ({ cls, children }) => <span className={'inline-block px-2 py-0.5 rounded-full text-xs font-semibold whitespace-nowrap ' + cls}>{children}</span>;

function AdminPanel({ onExit }) {
  const [clients, setClients] = useState(getClients());
  const [tab, setTab] = useState('clientes');
  const [sel, setSel] = useState(null);
  const [q, setQ] = useState('');
  const [fe, setFe] = useState('');
  const reload = () => setClients(getClients());
  const list = Object.values(clients).filter(c => {
    const qq = q.trim().toLowerCase();
    const okQ = !qq || normNit(c.nit).includes(normNit(qq) || '§') || (c.razon || '').toLowerCase().includes(qq) || String(c.nit).includes(qq);
    return okQ && (!fe || c.estado === fe);
  }).sort((a, b) => String(b.fechaVinc).localeCompare(String(a.fechaVinc)));
  const cur = sel && clients[sel];
  const open = (k, t) => { setSel(k); setTab(t || 'detalle'); window.scrollTo({ top: 0 }); };
  const tabs = [['clientes', 'Clientes'], ['detalle', 'Detalle cliente'], ['oficial', 'Oficial de Cumplimiento']];
  const today = todayISO();
  const stats = ESTADOS.map(e => [e, Object.values(clients).filter(c => c.estado === e).length]);

  return (<div className="min-h-screen pb-20">
    <Header title="Administración · Oficial de Cumplimiento" onBack={onExit} />
    <main className="max-w-6xl mx-auto px-3 md:px-4 py-5">
      <div className="flex gap-1 border-b border-gray-300 mb-5 overflow-x-auto">
        {tabs.map(t => { const dis = t[0] !== 'clientes' && !cur; return (
          <button key={t[0]} disabled={dis} onClick={() => setTab(t[0])} className={'px-4 py-2 text-sm font-semibold whitespace-nowrap border-b-2 -mb-px ' + (tab === t[0] ? 'border-[#C1272D] text-[#C1272D]' : 'border-transparent text-gray-600') + (dis ? ' opacity-40 cursor-not-allowed' : '')}>{t[1]}</button>); })}
        {cur && <span className="ml-auto self-center text-xs text-gray-500 hidden md:block pr-2">{cur.razon}</span>}
      </div>

      {tab === 'clientes' && (<div className="fade-in">
        <div className="grid grid-cols-2 md:grid-cols-5 gap-2 mb-4">
          {stats.map(s => <div key={s[0]} className="card p-3"><div className="text-2xl font-extrabold">{s[1]}</div><div className="text-[11px] text-gray-500">{s[0]}</div></div>)}
        </div>
        <div className="flex flex-col md:flex-row gap-2 mb-3">
          <input className={inputCls} placeholder="Buscar por NIT o razón social..." value={q} onChange={e => setQ(e.target.value)} />
          <select className={inputCls + ' md:w-64'} value={fe} onChange={e => setFe(e.target.value)}><option value="">Todos los estados</option>{ESTADOS.map(e => <option key={e}>{e}</option>)}</select>
        </div>
        <div className="card overflow-x-auto">
          <table className="w-full text-sm min-w-[820px]">
            <thead className="bg-[#1D1D1B] text-white text-xs uppercase"><tr>
              {['NIT', 'Razón social', 'Fecha vinculación', 'Tipo', 'Estado', 'Riesgo', 'Próx. actualización'].map(h => <th key={h} className="text-left px-3 py-2.5 font-semibold">{h}</th>)}</tr></thead>
            <tbody>
              {list.length === 0 && <tr><td colSpan={7} className="text-center text-gray-500 py-10">No hay clientes registrados.</td></tr>}
              {list.map(c => (<tr key={c.nit} onClick={() => open(c.nit)} className="border-t hover:bg-red-50 cursor-pointer">
                <td className="px-3 py-2.5 font-mono text-xs">{c.data ? c.data.gen.nit : c.nit}</td>
                <td className="px-3 py-2.5 font-medium">{c.razon}</td>
                <td className="px-3 py-2.5">{fmtDate(c.fechaVinc)}</td>
                <td className="px-3 py-2.5">{c.tipo}</td>
                <td className="px-3 py-2.5"><Badge cls={ESTADO_CLS[c.estado] || ''}>{c.estado}</Badge></td>
                <td className="px-3 py-2.5"><Badge cls={RIESGO_CLS[c.riesgo] || ''}>{c.riesgo}</Badge></td>
                <td className="px-3 py-2.5">{c.proxAct ? <span className={c.proxAct < today ? 'text-red-600 font-semibold' : ''}>{fmtDate(c.proxAct)}{c.proxAct < today ? ' (vencida)' : ''}</span> : <span className="text-gray-400">—</span>}</td>
              </tr>))}
            </tbody>
          </table>
        </div>
        <p className="text-xs text-gray-500 mt-3">Almacenamiento local usado: {(LS.size() / 1048576).toFixed(2)} MB de ~5 MB.</p>
      </div>)}

      {tab === 'detalle' && cur && <ClientDetail c={cur} onOfficer={() => setTab('oficial')} />}
      {tab === 'oficial' && cur && <OfficerEval key={cur.nit} c={cur} onSaved={reload} />}
    </main>
  </div>);
}

const KV = ({ label, value, wide }) => (<div className={wide ? 'md:col-span-3' : ''}><div className="text-[11px] uppercase tracking-wide text-gray-400 font-semibold">{label}</div><div className="text-sm break-words">{value === '' || value == null ? <span className="text-gray-300">—</span> : value}</div></div>);
const Block = ({ title, children }) => (<div className="card p-4 mb-3"><h3 className="font-bold text-[#9E1F24] mb-3 text-sm uppercase tracking-wide">{title}</h3>{children}</div>);
const G3 = ({ children }) => <div className="grid grid-cols-1 md:grid-cols-3 gap-x-4 gap-y-3">{children}</div>;
const Sub = ({ items, render, empty }) => items && items.length ? <div className="space-y-2 mt-2">{items.map((it, i) => <div key={i} className="bg-gray-50 border rounded-lg p-3"><G3>{render(it)}</G3></div>)}</div> : <div className="text-sm text-gray-400 mt-1">{empty || 'Sin registros'}</div>;

function dlLink(fl) { return <a className="text-[#C1272D] font-semibold hover:underline text-sm" href={fl.data} download={fl.name}>Descargar</a>; }

function ClientDetail({ c, onOfficer }) {
  const f = mergeForm(c.data);
  const [, force] = useState(0);
  const g = f.gen, ct = f.contacto, fi = f.fin;
  return (<div className="fade-in">
    <div className="card p-4 mb-3 flex flex-col md:flex-row md:items-center gap-3">
      <div className="flex-1"><div className="text-lg font-bold">{c.razon}</div><div className="text-sm text-gray-500">NIT {g.nit} · {c.tipo} · Vinculación {fmtDate(c.fechaVinc)}</div></div>
      <div className="flex gap-2 items-center"><Badge cls={ESTADO_CLS[c.estado]}>{c.estado}</Badge><Badge cls={RIESGO_CLS[c.riesgo]}>Riesgo {c.riesgo}</Badge></div>
      <button className="btn btn-primary" onClick={onOfficer}>Evaluar →</button>
    </div>
    <Block title="A. Datos generales"><G3>
      <KV label="Razón social" value={g.razon} /><KV label="NIT" value={g.nit} /><KV label="Nombre comercial" value={g.comercial} />
      <KV label="Tipo sociedad" value={g.tipoSoc} /><KV label="Fecha constitución" value={fmtDate(g.fechaConst)} /><KV label="Lugar constitución" value={g.lugarConst} />
      <KV label="CIIU" value={g.ciiu} /><KV label="Objeto social" value={g.objeto} wide /><KV label="Actividad económica" value={g.actividad} wide /></G3></Block>
    <Block title="B. Contacto"><G3>
      <KV label="Dirección" value={ct.dir} /><KV label="Ciudad" value={ct.ciudad} /><KV label="Departamento" value={ct.depto} /><KV label="País" value={ct.pais} />
      <KV label="Teléfono" value={ct.tel} /><KV label="Celular" value={ct.cel} /><KV label="Email" value={ct.email} /><KV label="Sitio web" value={ct.web} /></G3></Block>
    <Block title="C. Representantes legales"><Sub items={f.reps} render={r => (<>
      <KV label="Nombre" value={r.nombre} /><KV label="Documento" value={r.tipoDoc + ' ' + r.numDoc} /><KV label="Expedición" value={fmtDate(r.fechaExp) + ' ' + r.lugarExp} />
      <KV label="¿PEP?" value={r.pep} />{r.pep === 'Sí' && <><KV label="Cargo / entidad" value={r.pepCargo + ' / ' + r.pepEntidad} /><KV label="Vinculación - Desvinculación" value={fmtDate(r.pepVinc) + ' - ' + fmtDate(r.pepDesvinc)} /></>}</>)} /></Block>
    <Block title="D. Composición accionaria"><Sub items={f.accionistas} render={a => (<>
      <KV label="Nombre" value={a.nombre} /><KV label="Documento" value={a.tipoDoc + ' ' + a.numDoc} /><KV label="% participación" value={a.porc} /><KV label="PEP" value={a.pep} /><KV label="País residencia" value={a.pais} /></>)} /></Block>
    <Block title="E. Información financiera y tributaria"><G3>
      <KV label="Capital social" value={money(fi.capital)} /><KV label="CIIU" value={fi.ciiu || g.ciiu} /><KV label="Fecha constitución" value={fmtDate(fi.fechaConst || g.fechaConst)} />
      <KV label="Origen de fondos" value={fi.origen} wide /><KV label="Régimen IVA" value={fi.ivaReg} /><KV label="Gran contribuyente" value={fi.granContrib} /><KV label="Autorretenedor" value={fi.autorret} /><KV label="Agente retención" value={fi.agenteRet} />
      <KV label="Total activos" value={money(fi.activos)} /><KV label="Total pasivos" value={money(fi.pasivos)} /><KV label="Patrimonio" value={money(patrimonio(f))} />
      <KV label="Ingresos operacionales" value={money(fi.ingresos)} /><KV label="Total egresos" value={money(fi.egresos)} /><KV label="Otros ingresos" value={money(fi.otrosIngresos)} /></G3></Block>
    <Block title="F. Comercio exterior"><G3>
      <KV label="Importa" value={f.comex.imports.map(x => x.p).filter(Boolean).join(', ')} /><KV label="Exporta" value={f.comex.exports.map(x => x.p).filter(Boolean).join(', ')} />
      <KV label="Medios de pago" value={MEDIOS_PAGO.filter(m => f.comex.pagos[m]).join(', ')} />
      <KV label="Banco comex" value={f.comex.banco.nombre} /><KV label="Cuenta" value={f.comex.banco.cuenta} /><KV label="Tel. / País" value={f.comex.banco.tel + ' / ' + f.comex.banco.pais} /></G3>
      <div className="text-xs font-bold text-gray-500 mt-3">Personas que realizan operaciones</div>
      <Sub items={f.comex.personas} render={p => (<><KV label="Nombre" value={p.nombre} /><KV label="Documento" value={p.doc} /><KV label="Teléfono" value={p.tel} /><KV label="Dirección" value={p.dir} /><KV label="Email" value={p.email} /></>)} /></Block>
    <Block title="G. Personas de contacto"><Sub items={f.contactos.filter(p => p.nombre || p.rol)} render={p => (<><KV label="Rol" value={p.rol} /><KV label="Nombre" value={p.nombre} /><KV label="Teléfono" value={p.tel} /><KV label="Email" value={p.email} /></>)} /></Block>
    <Block title="H. Clientes y proveedores">
      <div className="text-xs font-bold text-gray-500">Clientes</div><Sub items={f.clientes} render={p => (<><KV label="Nombre" value={p.nombre} /><KV label="Identificación" value={p.id} /><KV label="Dirección" value={p.dir} /></>)} />
      <div className="text-xs font-bold text-gray-500 mt-3">Proveedores</div><Sub items={f.proveedores} render={p => (<><KV label="Nombre" value={p.nombre} /><KV label="Identificación" value={p.id} /><KV label="Dirección" value={p.dir} /></>)} /></Block>
    <Block title="I. Referencias">
      <Sub items={f.refCom} render={p => (<><KV label="Ref. comercial" value={p.nombre} /><KV label="Identificación" value={p.id} /><KV label="Teléfono" value={p.tel} /></>)} />
      <Sub items={f.refBanc} render={p => (<><KV label="Entidad bancaria" value={p.entidad} /><KV label="Tipo / No. cuenta" value={p.tipo + ' ' + p.cuenta} /><KV label="Teléfono" value={p.tel} /></>)} /></Block>
    <Block title="J. Calidad y seguridad"><G3>
      <KV label="Sistema de gestión certificado" value={f.calidad.sgc + (f.calidad.sgcCual ? ' - ' + f.calidad.sgcCual : '')} /><KV label="BASC / OEA" value={f.calidad.basc + (f.calidad.bascCual ? ' - ' + f.calidad.bascCual : '')} /><KV label="Controles" value={f.calidad.controles} /></G3></Block>
    <Block title="K. Visita de seguridad">
      <G3><KV label="Atiende" value={f.visita.atiende} /><KV label="Cargo" value={f.visita.cargoAtiende} /><KV label="Fecha" value={fmtDate(f.visita.fecha)} /></G3>
      <div className="mt-3 divide-y border rounded-lg">{VISITA_Q.map((q, i) => { const a = f.visita.q[i + 1] || {}; return (<div key={i} className="p-2 text-sm flex gap-2"><span className="text-gray-400 w-6">{i + 1}.</span><span className="flex-1">{q}{a.obs && <span className="block text-xs text-gray-500">Obs: {a.obs}</span>}</span><b className="w-10 text-right">{a.r || '—'}</b></div>); })}</div></Block>
    <Block title="L. Declaraciones"><ul className="text-sm space-y-1">
      {[['fondos', 'Origen lícito de fondos'], ['listas', 'Autorización consulta en listas'], ['datos', 'Tratamiento de datos personales'], ['basc', 'Compromisos BASC']].map(x => <li key={x[0]}>{f.decl[x[0]] ? '✅' : '⬜'} {x[1]}</li>)}</ul></Block>
    <Block title="M. Firma"><G3><KV label="Firmante" value={f.firma.nombre} /><KV label="Documento" value={f.firma.doc} /><KV label="Cargo" value={f.firma.cargo} /><KV label="Ciudad" value={f.firma.ciudad} /><KV label="Fecha" value={fmtDate(f.firma.fecha)} /></G3></Block>

    <Block title="Documentos cargados">
      <div className="divide-y">{DOCS_REQ.map(d => { const fl = (c.files || {})[d.key]; return (<div key={d.key} className="py-2 flex items-center gap-3 text-sm">
        <span className={'text-xs font-bold px-2 py-0.5 rounded-full ' + (fl ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700')}>{fl ? 'Cargado' : 'Pendiente'}</span>
        <span className="flex-1">{d.label}{fl && <span className="block text-xs text-gray-500">{fl.name}</span>}</span>{fl && dlLink(fl)}</div>); })}
        {Object.keys(c.files || {}).filter(k => k.startsWith('otro_')).map(k => <div key={k} className="py-2 flex items-center gap-3 text-sm"><span className="text-xs font-bold px-2 py-0.5 rounded-full bg-blue-100 text-blue-700">Adicional</span><span className="flex-1">{c.files[k].name}</span>{dlLink(c.files[k])}</div>)}
      </div></Block>
    <Block title="Documentos generados">
      <div className="grid md:grid-cols-2 gap-2">{GEN_DOCS.map(d => (<div key={d.key} className="flex items-center gap-3 border rounded-lg p-3"><div className="flex-1 text-sm"><b className="text-[#C1272D]">{d.codigo}</b> · {d.titulo}</div>
        <button className="btn btn-ghost text-xs" onClick={() => downloadPDF(d.key, f, c.tipo)}>PDF</button></div>))}</div>
      <button className="btn btn-dark mt-3" onClick={() => GEN_DOCS.forEach((d, i) => setTimeout(() => downloadPDF(d.key, f, c.tipo), i * 700))}>⬇ Descargar todos</button></Block>
  </div>);
}

function OfficerEval({ c, onSaved }) {
  const [st, setSt] = useState({ estado: c.estado, riesgo: c.riesgo, puntaje: c.puntaje, fechaAprob: c.fechaAprob, proxAct: c.proxAct, obs: c.obs || '' });
  const [hist, setHist] = useState(c.historial || []);
  const [ok, setOk] = useState('');
  const u = (k, v) => setSt(s => { const n = Object.assign({}, s, { [k]: v });
    if (k === 'fechaAprob' && v && (!s.proxAct || s.proxAct === addYear(s.fechaAprob))) n.proxAct = addYear(v); return n; });
  const save = () => {
    const ch = [];
    if (st.estado !== c.estado) ch.push('Estado: ' + c.estado + ' → ' + st.estado);
    if (st.riesgo !== c.riesgo) ch.push('Riesgo: ' + c.riesgo + ' → ' + st.riesgo);
    if (String(st.puntaje) !== String(c.puntaje)) ch.push('Puntaje: ' + (c.puntaje || '—') + ' → ' + (st.puntaje || '—'));
    if (st.fechaAprob !== c.fechaAprob) ch.push('Fecha aprobación: ' + fmtDate(st.fechaAprob));
    if (st.proxAct !== c.proxAct) ch.push('Próxima actualización: ' + fmtDate(st.proxAct));
    const accion = 'Evaluación del Oficial de Cumplimiento' + (ch.length ? ' - ' + ch.join('; ') : ' (sin cambios de campos)');
    const done = upsertClient(c.nit, Object.assign({}, st, { _log: { accion, nota: st.obs } }));
    if (!done) { alert('No se pudo guardar (almacenamiento lleno).'); return; }
    setHist(getClients()[c.nit].historial); setOk('Evaluación guardada ' + new Date().toLocaleTimeString('es-CO')); onSaved();
  };
  return (<div className="fade-in grid lg:grid-cols-2 gap-4">
    <div className="card p-5">
      <h3 className="font-bold mb-1">Evaluación del Oficial de Cumplimiento</h3>
      <p className="text-xs text-gray-500 mb-4">{c.razon} · NIT {c.data ? c.data.gen.nit : c.nit}</p>
      <div className="grid md:grid-cols-2 gap-3">
        <Field label="Estado del trámite" options={ESTADOS} value={st.estado} onChange={v => u('estado', v)} />
        <Field label="Nivel de riesgo" options={RIESGOS} value={st.riesgo} onChange={v => u('riesgo', v)} />
        <Field label="Puntaje de riesgo" type="number" value={st.puntaje} onChange={v => u('puntaje', v)} />
        <Field label="Fecha de aprobación" type="date" value={st.fechaAprob} onChange={v => u('fechaAprob', v)} />
        <Field label="Fecha próxima actualización" type="date" value={st.proxAct} onChange={v => u('proxAct', v)} hint="Se sugiere 1 año después de la aprobación" />
        <div className="md:col-span-2"><Field label="Observaciones del Oficial de Cumplimiento" rows={5} value={st.obs} onChange={v => u('obs', v)} /></div>
      </div>
      <div className="flex items-center gap-3 mt-4"><button className="btn btn-primary" onClick={save}>Guardar evaluación</button>{ok && <span className="text-sm text-green-700">{ok}</span>}</div>
    </div>
    <div className="card p-5">
      <h3 className="font-bold mb-3">Historial de cambios</h3>
      {hist.length === 0 && <p className="text-sm text-gray-400">Sin movimientos.</p>}
      <ol className="relative border-l-2 border-red-200 ml-2 space-y-4 max-h-[560px] overflow-y-auto pr-2">
        {hist.slice().reverse().map((h, i) => (<li key={i} className="ml-4"><span className="absolute -left-[7px] h-3 w-3 rounded-full bg-[#C1272D]" />
          <div className="text-xs text-gray-400">{new Date(h.fecha).toLocaleString('es-CO')}</div><div className="text-sm font-medium">{h.accion}</div>{h.nota && <div className="text-xs text-gray-600 mt-0.5 whitespace-pre-wrap">{h.nota}</div>}</li>))}
      </ol>
    </div>
  </div>);
}
</script>

<!-- ============ BLOQUE 6: APP / SELECCION DE ROL ============ -->
<script type="text/babel" data-presets="react">
function Landing({ onClient, onAdmin }) {
  const [askPass, setAskPass] = useState(false);
  const [pw, setPw] = useState('');
  const [err, setErr] = useState(false);
  const tryLogin = () => { if (pw === ADMIN_PASS) onAdmin(); else setErr(true); };
  return (<div className="min-h-screen flex flex-col">
    <div className="bg-[#1D1D1B] text-white"><div className="max-w-5xl mx-auto px-4 py-10 text-center">
      <div className="inline-block bg-[#C1272D] px-4 py-1 rounded font-extrabold text-xl tracking-widest mb-4">TI CARGO</div>
      <h1 className="text-2xl md:text-4xl font-extrabold">Portal de Vinculación SAGRILAFT</h1>
      <p className="text-gray-300 mt-2 text-sm md:text-base">{CO.nombre} · NIT {CO.nit}</p></div>
      <div className="h-1.5 bg-gradient-to-r from-[#C1272D] to-[#9E1F24]" /></div>
    <main className="flex-1 max-w-4xl w-full mx-auto px-4 py-10 grid md:grid-cols-2 gap-5">
      <button onClick={onClient} className="card p-8 text-left hover:shadow-xl hover:-translate-y-1 transition group border-t-4 border-t-[#C1272D]">
        <div className="h-14 w-14 rounded-2xl bg-red-50 text-[#C1272D] grid place-items-center text-3xl mb-4">🏢</div>
        <h2 className="text-xl font-bold group-hover:text-[#C1272D]">Portal Cliente</h2>
        <p className="text-sm text-gray-600 mt-2">Diligencie su información una sola vez, genere los formatos de vinculación y cargue sus documentos soporte.</p>
        <span className="inline-block mt-4 text-sm font-semibold text-[#C1272D]">Ingresar →</span></button>
      <div className="card p-8 text-left border-t-4 border-t-[#1D1D1B]">
        <div className="h-14 w-14 rounded-2xl bg-gray-100 text-[#1D1D1B] grid place-items-center text-3xl mb-4">🛡️</div>
        <h2 className="text-xl font-bold">Administración</h2>
        <p className="text-sm text-gray-600 mt-2">Panel del Oficial de Cumplimiento: revisión de clientes, estado del trámite y evaluación de riesgo.</p>
        {!askPass ? <button className="mt-4 text-sm font-semibold text-[#1D1D1B] hover:underline" onClick={() => setAskPass(true)}>Ingresar →</button> : (
          <div className="mt-4 fade-in"><input autoFocus type="password" className={inputCls} placeholder="Contraseña" value={pw} onChange={e => { setPw(e.target.value); setErr(false); }} onKeyDown={e => e.key === 'Enter' && tryLogin()} />
            {err && <p className="text-xs text-red-600 mt-1">Contraseña incorrecta.</p>}
            <button className="btn btn-dark mt-2 w-full" onClick={tryLogin}>Entrar</button></div>)}
      </div>
    </main>
    <footer className="text-center text-xs text-gray-500 py-6 px-4">{CO.dir} · {CO.tel} · {CO.email}<br />Oficial de Cumplimiento: {CO.oficial} · Datos almacenados localmente en este navegador.</footer>
  </div>);
}

function App() {
  const [role, setRole] = useState(null);
  if (role === 'cliente') return <ClientPortal onExit={() => setRole(null)} />;
  if (role === 'admin') return <AdminPanel onExit={() => setRole(null)} />;
  return <Landing onClient={() => setRole('cliente')} onAdmin={() => setRole('admin')} />;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
